name: Build guide PDFs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pdfs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc and emoji font
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-noto-color-emoji

      - name: Build PDFs
        run: CHROME="$(command -v google-chrome)" scripts/build-pdfs.sh build

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="PDFs of every guide, rebuilt automatically from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)."

          # Move the tag to this commit so the release always matches main.
          git tag -f latest
          git push -f origin latest

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "OpenEVSE Guides (PDF)" --notes "$notes" --latest
          else
            gh release create latest --title "OpenEVSE Guides (PDF)" --notes "$notes" --latest
          fi

          # Remove PDFs for guides that no longer exist, then upload the fresh set.
          for asset in $(gh release view latest --json assets --jq '.assets[].name'); do
            [[ -f "build/$asset" ]] || gh release delete-asset latest "$asset" --yes
          done
          gh release upload latest build/*.pdf --clobber
